    <title>Cloud Kitchen</title>
    <script>
      try {
        if (sessionStorage.getItem('as-cloud-kitchen-intro-seen')) {
          document.documentElement.classList.add('intro-seen');

          sessionStorage.setItem('as-cloud-kitchen-intro-seen', 'true');
        }
      } catch {}
    </script>
  </head>

        <span />

        <span />
        <span />
        <span />
      </div>
      <div class="splash-logo">
        <img src="/assets/cloud-kitchen-logo.jpg" alt="AS Cloud Kitchen — The Taste of Home Foods" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
